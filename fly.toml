# fly.toml app configuration file generated for re-newrld on 2026-10-06T07:11:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 're-newrld'
primary_region = 'ams'

[deploy]
  # Run migrations before the new version starts serving traffic.
  # Prevents boot-against-stale-schema 500s (audit finding 2026-10-16).
  release_command = 'npm run migrate'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # 256MB is plenty for this API; bump to '1gb' if load ever demands it.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

# Persistent volume for TTS narration audio (ADR-016) + uploaded media (ADR-017).
# Single-volume consolidation (2026-10-18): Fly allows only 1 volume per
# machine, so the 4GB narration_data volume hosts both /data/narrations
# (existing audio files) and /data/media (ADR-017 uploads) as subdirectories.
# ADR-017 addendum pending for the separate-media_data change.
[[mounts]]
  source = 'narration_data'
  destination = '/data'
