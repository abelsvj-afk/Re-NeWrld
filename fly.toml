# fly.toml app configuration file generated for re-newrld on 2026-10-06T07:11:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 're-newrld'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # 256MB is plenty for this API; bump to '1gb' if load ever demands it.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

# Persistent volume for TTS narration audio (ADR-016).
# Create with: flyctl volumes create narration_data --size 1 --app re-newrld --region ams
[[mounts]]
  source = 'narration_data'
  destination = '/data/narrations'
